[package]
name = "jwt-authorizer"
description = "jwt authorizer middleware for axum and tonic"
version = "0.15.10"
edition = "2021"
authors = ["cduvray <c_duvray@proton.me>"]
license = "MIT"
readme = "docs/README.md"
repository = "https://github.com/cduvray/jwt-authorizer"
keywords = ["jwt", "axum", "authorisation", "jwks"]
publish = ["dataspine"]

[dependencies]
axum = { version = "0.8" }
chrono = { version = "0.4", optional = true }
futures-util = "0.3"
futures-core = "0.3"
headers = "0.4"
jsonwebtoken = { version = "10.2.0", features = ["rust_crypto"] }
http = "1.1"
pin-project = "1.1"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.37" }
tower-http = { version = "0.6", features = ["trace", "auth"] }
tower-layer = "0.3"
tower-service = "0.3"
tracing = "0.1"
tonic = { version = "0.14", optional = true }
time = { version = "0.3", optional = true }
http-body-util = "0.1.1"
http-body = "1.0.1"
bytes = "1.6.0"

[dev-dependencies]
hyper = { version = "1.3.1", features = ["full"] }
lazy_static = "1.4.0"
prost = "0.14"
tower = { version = "0.5", features = ["util", "buffer"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wiremock = "0.6.1"

[features]
default = ["reqwest/rustls-tls", "chrono"]
rustls-tls = ["reqwest/rustls-tls"]
rustls-tls-manual-roots = ["reqwest/rustls-tls-manual-roots"]
rustls-tls-webpki-roots = ["reqwest/rustls-tls-webpki-roots"]
rustls-tls-native-roots = ["reqwest/rustls-tls-native-roots"]
time = ["dep:time"]
chrono = ["dep:chrono"]

[[test]]
name = "tonic"
required-features = ["tonic"]
